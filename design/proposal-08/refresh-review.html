<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refresh Monix review</title><style>body{font:16px/1.6 system-ui;background:#f7faf7;color:#1f3b46;max-width:560px;margin:12vh auto;padding:24px}button,a{display:inline-block;background:#3fd6a9;color:#123b30;padding:14px 20px;border:0;border-radius:13px;font:inherit;font-weight:650}p{margin:18px 0}button:disabled{opacity:.6}</style><h1>A fresh look at Monix.</h1><p>This updates the design-review shell. Sample accounts and preferences stay on this device.</p><button id="refresh">Load latest Proposal 08</button><p id="status" role="status"></p><a href="Monix-Proposal-08-Review.html">Return to review</a><script>
document.querySelector('#refresh').addEventListener('click',async()=>{const button=document.querySelector('#refresh'),status=document.querySelector('#status');button.disabled=true;status.textContent='Checking the review update…';try{const reg=await navigator.serviceWorker.getRegistration();if(reg){await reg.update();const worker=reg.installing||reg.waiting;if(worker&&worker.state!=='activated')await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('The update needs more time. Try again while connected.')),25000);const check=()=>{if(worker.state==='activated'){clearTimeout(timer);resolve();}if(worker.state==='redundant'){clearTimeout(timer);reject(Error('The update could not be installed. Previous offline files are retained.'));}};worker.addEventListener('statechange',check);check();});}status.textContent='Review updated. Opening Proposal 08…';location.replace('Monix-Proposal-08-Review.html');}catch(error){status.textContent=error.message;button.disabled=false;}});
</script></html>
